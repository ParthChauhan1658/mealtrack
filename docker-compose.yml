services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mealtrack
      POSTGRES_USER: ${DB_USER:-mealtrack}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mealtrack}
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mealtrack}"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  dbdata:
