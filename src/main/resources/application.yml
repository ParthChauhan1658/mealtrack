spring:
  application:
    name: mealtrack
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mealtrack}
    username: ${DB_USER:mealtrack}
    password: ${DB_PASSWORD:mealtrack}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

mealtrack:
  api-key: ${MEALTRACK_API_KEY:}
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
  validation:
    max-age-days: 7
    reject-factor: 2.0

management:
  endpoints:
    web:
      exposure:
        include: health,info
