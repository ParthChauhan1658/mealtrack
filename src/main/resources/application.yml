server:
  port: ${PORT:8080}   # Render injects PORT

spring:
  application:
    name: mealtrack
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mealtrack}
    username: ${DB_USER:mealtrack}
    password: ${DB_PASSWORD:mealtrack}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}   # lower (e.g. 5) for small free-tier databases
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

mealtrack:
  api-key: ${MEALTRACK_API_KEY:}
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
  validation:
    max-age-days: 7
    reject-factor: 2.0
  anomaly:
    drop-ratio: 0.60          # SUDDEN_DROP below this share of the recent average
    severe-drop-ratio: 0.40   # ...HIGH severity below this share
    spike-ratio: 1.40         # SPIKE above this share of the recent average
    capacity-factor: 1.5      # EXCEEDS_CAPACITY above this multiple of expected_meals
    window-days: 7            # reported days used for the average
    min-history-days: 3       # drop/spike rules need at least this many days of history
    cutoff-time: ${CUTOFF_TIME:14:00}   # IST; no report by now means MISSING_REPORT
    missing-report-cron: "${MISSING_REPORT_CRON:0 0 14 * * MON-SAT}"   # at the cutoff, IST; set to "-" to disable the job
  llm:
    provider: ${LLM_PROVIDER:none}   # claude | gemini | none (rules only)
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:}             # empty = provider default
    timeout-ms: 5000
    max-retries: 2
    backoff-ms: 300

management:
  endpoints:
    web:
      exposure:
        include: health,info
