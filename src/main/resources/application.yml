spring:
  application:
    name: mealtrack
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mealtrack}
    username: ${DB_USER:mealtrack}
    password: ${DB_PASSWORD:mealtrack}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
