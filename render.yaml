# Render Blueprint (NOT deployed yet). Database: use Neon (free, no 30-day expiry) and paste its JDBC URL
# into DB_URL, e.g. jdbc:postgresql://<host>/<db>?sslmode=require
services:
  - type: web
    name: mealtrack-api
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: MEALTRACK_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: none
      - key: CUTOFF_TIME
        value: "14:00"
      # Public demo has no live reporters, so the daily job would flag every centre as missing. "-" disables it.
      - key: MISSING_REPORT_CRON
        value: "-"
      - key: DB_POOL_SIZE
        value: "5"
      - key: CORS_ORIGIN
        sync: false # the dashboard's URL, e.g. https://mealtrack-dashboard.onrender.com (no trailing slash)

  - type: web
    name: mealtrack-dashboard
    runtime: static
    rootDir: dashboard
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Build-time: the dashboard calls the API directly, so the API's CORS_ORIGIN must be this site's URL.
      # Change it if Render gives the API service a different URL than the name below.
      - key: VITE_API_BASE_URL
        value: https://mealtrack-api-334n.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
