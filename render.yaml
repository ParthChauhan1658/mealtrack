# Render Blueprint (NOT deployed yet). Database: use Neon (free, no 30-day expiry) and paste its JDBC URL
# into DB_URL, e.g. jdbc:postgresql://<host>/<db>?sslmode=require
services:
  - type: web
    name: mealtrack-api
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: MEALTRACK_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: none
      - key: CORS_ORIGIN
        sync: false # the dashboard's URL; only needed if the browser calls the API cross-origin

  - type: web
    name: mealtrack-dashboard
    runtime: static
    rootDir: dashboard
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # Keeps the dashboard same-origin: /api/* is forwarded to the API service.
      - type: rewrite
        source: /api/*
        destination: https://mealtrack-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
